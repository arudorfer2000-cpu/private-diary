# Publishes the web app to GitHub Pages (free). Runs on every push to main, or by hand from the Actions tab.
name: Publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-docx # one test opens the Word export with it
      - run: npm test
      - run: npm run audit
      - name: Build the web app for the repository's address
        run: PD_BASE_URL=/${{ github.event.repository.name }} npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
